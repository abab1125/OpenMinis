name: Build Android Debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.12433566" --install > /dev/null 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> $GITHUB_ENV

      - name: Build PRoot
        run: |
          cd "${{ github.workspace }}/deps"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566
          bash build_proot.sh

      - name: Download Alpine rootfs
        working-directory: ${{ github.workspace }}
        run: bash scripts/prepare_android_sandbox.sh

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          name: "最新构建 ${{ github.sha }}"
          body: |
            自动构建于 commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ## 书架 + 小说创作版
            - 书架：创建/管理小说项目
            - Agent 写作工具：`book_*` 工具集
            - 四层写作上下文
          artifacts: "src/android/app/build/outputs/apk/debug/*.apk"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: true
