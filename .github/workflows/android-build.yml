name: Build Android Debug APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  NDK_VERSION: "28.0.12433566"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src/android

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Get PRoot submodule commit
        id: proot_commit
        working-directory: ${{ github.workspace }}
        run: echo "commit=$(git -C deps/proot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.NDK_VERSION }}" --install > /dev/null 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      # --- Caches (speed up + stabilize) ---
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache downloadable assets (rootfs / proot deb / talloc)
        uses: actions/cache@v4
        with:
          path: ~/.cache/openminis
          key: dl-${{ hashFiles('scripts/prepare_android_sandbox.sh', 'deps/build_proot.sh') }}
          restore-keys: dl-

      # Exact-key only (no restore-keys): the key binds the proot submodule
      # commit, so a stale cache from a different proot source can never be
      # restored and silently produce a wrong binary.
      - name: Cache PRoot build
        uses: actions/cache@v4
        with:
          path: |
            deps/build
            deps/proot/src
            deps/talloc
          key: proot-${{ env.NDK_VERSION }}-${{ steps.proot_commit.outputs.commit }}-${{ hashFiles('deps/build_proot.sh') }}

      - name: Build PRoot
        run: |
          cd "${{ github.workspace }}/deps"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          bash build_proot.sh

      - name: Download Alpine rootfs
        working-directory: ${{ github.workspace }}
        run: bash scripts/prepare_android_sandbox.sh

      - name: Restore debug keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            mkdir -p $HOME/.android
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > $HOME/.android/debug.keystore
            echo "Restored custom debug keystore"
          else
            echo "Using default debug keystore (will not be installable over previous builds)"
          fi

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Determine release version
        id: ver
        working-directory: ${{ github.workspace }}
        run: |
          ver=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' src/android/app/build.gradle.kts)
          if [ -z "$ver" ]; then
            echo "::error::Could not parse versionName from src/android/app/build.gradle.kts"
            exit 1
          fi
          echo "name=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Release version: v$ver"

      - name: Guard - version tag must not already exist
        working-directory: ${{ github.workspace }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionName/versionCode in src/android/app/build.gradle.kts before releasing a new build."
            exit 1
          fi
          echo "Tag $TAG is free - proceeding."

      - name: Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.name }}"
          body: |
            自动构建于 commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ## 书架 + 小说创作版
            - 书架：创建/管理小说项目
            - Agent 写作工具：`book_*` 工具集
            - 四层写作上下文
          artifacts: "src/android/app/build/outputs/apk/debug/*.apk"
          makeLatest: true
          prerelease: true
